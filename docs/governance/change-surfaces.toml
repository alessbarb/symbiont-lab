schema_version = 2

[[surface]]
id = "governance-control"
paths = [
  "AGENTS.md",
  "CLAUDE.md",
  "docs/governance/**",
  "scripts/agentctl.py",
  "scripts/governance/**",
  ".github/**",
  ".agents/**",
  ".claude/**",
  ".codex/**",
  "pyproject.toml",
  "pyrightconfig.json",
  "uv.lock",
  "conftest.py",
]
classification = "CONSTITUTIONAL"

# What each library declares it depends on, and the checks that keep the five
# domains apart, decide the architecture: never ORDINARY.
[[surface]]
id = "domain-boundaries"
paths = [
  "symbiont/pyproject.toml",
  "embodiment/pyproject.toml",
  "modality/pyproject.toml",
  "environment/pyproject.toml",
  "lab/pyproject.toml",
  "scripts/check_isolation.py",
  "scripts/run_tests.py",
  "tests/experimental_integrity/test_five_domain_architecture.py",
  "symbiont/tests/test_independence.py",
  "embodiment/tests/test_self_contained.py",
  "modality/tests/test_self_contained.py",
  "environment/tests/test_self_contained.py",
]
classification = "CONSTITUTIONAL"

[[surface]]
id = "scientific-protocol"
paths = ["lab/experiments/**", "docs/design/**", "lab/research/**"]
classification = "SCIENTIFIC"

[[surface]]
id = "organism-causal-runtime"
paths = ["symbiont/src/symbiont/**"]
classification = "SCIENTIFIC"
equivalence = ["developed-cognition"]

[[surface]]
id = "private-model-lifecycle"
paths = ["lab/src/lab/physics3d/private_model_training.py", "lab/src/lab/modeling/**"]
classification = "SCIENTIFIC"
equivalence = ["private-model-training", "promotion-eligible"]

[[surface]]
id = "physics3d-causal-engine"
paths = [
  "lab/src/lab/physics3d/effects.py",
  "lab/src/lab/physics3d/engine.py",
  "lab/src/lab/physics3d/persistence.py",
  "environment/src/environment/physics3d/resource.py",
  "lab/src/lab/physics3d/runtime.py",
  "lab/src/lab/physics3d/settling.py",
  "lab/src/lab/world/**",
  "lab/src/lab/integration/**",
  "environment/src/environment/**",
  "embodiment/src/embodiment/**",
  "modality/src/modality/**",
]
classification = "SCIENTIFIC"
equivalence = ["established-anthropomorphic", "developed-cognition"]

[[surface]]
id = "reembodiment"
paths = ["symbiont/src/symbiont/core/embodiment/transition.py", "symbiont/src/symbiont/**"]
classification = "SCIENTIFIC"
symbols = ["reembodiment", "embodiment", "BodySchema", "body_schema"]
equivalence = ["reembodied-established"]

[[surface]]
id = "observatory-presentation"
paths = ["lab/src/lab/observatory/**", "lab/src/lab/workbench/web/**"]
classification = "ORDINARY"


[[surface]]
id = "equivalence-control-plane"
paths = [
  "lab/src/lab/physics3d/equivalence.py",
  "lab/src/lab/physics3d/equivalence_suite.py",
  "lab/src/lab/modeling/determinism.py",
  "lab/src/lab/experiments/snapshot_archive.py",
  "lab/src/lab/experiments/resource_guard.py",
  "lab/src/lab/experiments/execution_workspace.py",
  "lab/experiments/equivalence/**",
  "lab/tests/integration/test_equivalence*.py",
  "lab/tests/unit/lab/experiments/test_snapshot_archive.py",
  "lab/tests/unit/lab/experiments/test_resource_guard.py",
]
classification = "CONSTITUTIONAL"


[[surface]]
id = "lab-run-control"
paths = [
  "lab/src/lab/app/physics3d/runs.py",
  "lab/src/lab/app/physics3d/session.py",
]
classification = "SCIENTIFIC"
equivalence = ["established-anthropomorphic", "developed-cognition"]


[[surface]]
id = "governance-tests"
paths = ["tests/governance/**", ".pre-commit-config.yaml", ".gitignore"]
classification = "CONSTITUTIONAL"

[[surface]]
id = "architectural-decisions"
paths = ["docs/adr/**"]
classification = "CONSTITUTIONAL"

[[surface]]
id = "scientific-direction"
paths = ["docs/methodology/**"]
classification = "SCIENTIFIC"

[[surface]]
id = "project-roadmap"
paths = ["docs/roadmap.md"]
classification = "ORDINARY"

[[surface]]
id = "scientific-evidence-tests"
paths = [
  "tests/experimental_integrity/**",
  "tests/experiments/**",
  "symbiont/tests/experimental_integrity/**",
  "lab/tests/experimental_integrity/**",
  "lab/tests/experiments/**",
]
classification = "SCIENTIFIC"

[[surface]]
id = "scientific-study-code"
paths = ["lab/src/lab/studies/**", "lab/src/lab/experiments/**"]
classification = "SCIENTIFIC"

# Every remaining Lab source path. More specific surfaces above still elevate.
[[surface]]
id = "lab-composition"
paths = ["lab/src/lab/**"]
classification = "ORDINARY"

# The suites owned by each domain. The experimental-integrity and experiment
# layers are elevated by `scientific-evidence-tests`.
# Documentation owned by a domain.
[[surface]]
id = "domain-docs"
paths = ["symbiont/docs/**"]
classification = "ORDINARY"

[[surface]]
id = "domain-test-suites"
paths = [
  "symbiont/tests/**",
  "embodiment/tests/**",
  "modality/tests/**",
  "environment/tests/**",
  "lab/tests/**",
  "tests/**",
]
classification = "ORDINARY"
