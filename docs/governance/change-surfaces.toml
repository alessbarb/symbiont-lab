schema_version = 2

[[surface]]
id = "governance-control"
paths = ["AGENTS.md", "CLAUDE.md", "docs/governance/**", "scripts/agentctl.py", "scripts/governance/**", ".github/**", ".agents/**", ".claude/**", ".codex/**", "pyproject.toml", "pyrightconfig.json"]
classification = "CONSTITUTIONAL"

[[surface]]
id = "scientific-protocol"
paths = ["experiments/**", "docs/design/**", "research/**"]
classification = "SCIENTIFIC"

[[surface]]
id = "organism-causal-runtime"
paths = ["src/symbiont/**"]
classification = "SCIENTIFIC"
equivalence = ["developed-cognition"]

[[surface]]
id = "private-model-lifecycle"
paths = ["src/symbiont_lab/physics3d/private_model_training.py", "src/symbiont_lab/modeling/**"]
classification = "SCIENTIFIC"
diff_regex = ["promotion", "active", "shadow", "training", "model_registry", "lineage", "adopt_private_model", "activate_private_model"]
equivalence = ["private-model-training", "promotion-eligible"]

[[surface]]
id = "physics3d-causal-engine"
paths = ["src/symbiont_lab/physics3d/engine.py", "src/symbiont_lab/world/**", "src/symbiont_world/**"]
classification = "SCIENTIFIC"
equivalence = ["established-anthropomorphic", "developed-cognition"]

[[surface]]
id = "reembodiment"
paths = ["src/symbiont_lab/physics3d/reembodiment.py", "src/symbiont/**"]
classification = "SCIENTIFIC"
symbols = ["reembodiment", "embodiment", "BodySchema", "body_schema"]
equivalence = ["reembodied-established"]

[[surface]]
id = "observatory-presentation"
paths = ["observatory/**", "src/symbiont_lab/app/**", "src/symbiont_lab/workbench/**"]
classification = "ORDINARY"


[[surface]]
id = "equivalence-control-plane"
paths = [
  "src/symbiont_lab/physics3d/equivalence.py",
  "src/symbiont_lab/physics3d/equivalence_suite.py",
  "src/symbiont_lab/modeling/determinism.py",
  "src/symbiont_lab/experiments/snapshot_archive.py",
  "src/symbiont_lab/experiments/resource_guard.py",
  "src/symbiont_lab/experiments/execution_workspace.py",
  "experiments/equivalence/**",
  "tests/integration/test_equivalence*.py",
  "tests/unit/lab/experiments/test_snapshot_archive.py",
  "tests/unit/lab/experiments/test_resource_guard.py",
]
classification = "CONSTITUTIONAL"
