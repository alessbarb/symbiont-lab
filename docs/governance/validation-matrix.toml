schema_version = 3

[docs]
ci_lanes = ["docs"]
paths = ["README.md", "ORGANISM.md", "docs/**", "AGENTS.md", "CLAUDE.md"]

[governance]
ci_lanes = ["governance"]
paths = ["docs/governance/**", "AGENTS.md", "CLAUDE.md", "scripts/agentctl.py", "scripts/governance/**", "tests/governance/**", ".github/**", ".pre-commit-config.yaml", ".gitignore", ".agents/**", ".claude/**", ".codex/**", "pyproject.toml", "pyrightconfig.json"]

[subject]
ci_lanes = ["software_core", "architecture_integrity"]
paths = ["symbiont/src/symbiont/**"]

[lab]
ci_lanes = ["software_core", "architecture_integrity"]
paths = ["lab/src/lab/**"]

[world]
ci_lanes = ["world", "architecture_integrity"]
paths = ["environment/src/environment/**", "lab/src/lab/world/**"]

[observatory]
ci_lanes = ["observatory", "architecture_integrity"]
# The launchers that publish to the Observatory live in the Lab; their contract
# suite is observatory/tests, so a change to them must select this lane too.
paths = ["observatory/**", "lab/src/lab/cli/observed_*.py"]

[experiment_protocol]
ci_lanes = ["experiment_mechanics", "architecture_integrity"]
paths = ["lab/experiments/**", "lab/src/lab/studies/**", "docs/design/**", "lab/research/**"]

[tests]
ci_lanes = ["canonical_full"]
paths = ["tests/**"]
