schema_version = 3

[docs]
ci_lanes = ["docs"]
paths = ["README.md", "docs/**", "symbiont/docs/**", "migration/**", "*/README.md", "AGENTS.md", "CLAUDE.md"]

[governance]
ci_lanes = ["governance"]
paths = ["docs/governance/**", "AGENTS.md", "CLAUDE.md", "scripts/agentctl.py", "scripts/governance/**", "tests/governance/**", ".github/**", ".pre-commit-config.yaml", ".gitignore", ".agents/**", ".claude/**", ".codex/**", "pyproject.toml", "pyrightconfig.json", "uv.lock", "conftest.py"]

# A change to what a library declares, or to the checks that keep the domains
# apart, runs everything.
[domain_boundaries]
ci_lanes = ["architecture_integrity", "canonical_full"]
paths = ["symbiont/pyproject.toml", "embodiment/pyproject.toml", "modality/pyproject.toml", "environment/pyproject.toml", "lab/pyproject.toml", "scripts/check_isolation.py", "scripts/run_tests.py"]

[subject]
ci_lanes = ["software_core", "architecture_integrity"]
paths = ["symbiont/src/symbiont/**", "symbiont/tests/**"]

[embodiment]
ci_lanes = ["software_core", "architecture_integrity"]
paths = ["embodiment/src/embodiment/**", "embodiment/tests/**"]

[modality]
ci_lanes = ["software_core", "architecture_integrity"]
paths = ["modality/src/modality/**", "modality/tests/**"]

[lab]
ci_lanes = ["software_core", "architecture_integrity"]
paths = ["lab/src/lab/**", "lab/tests/**"]

[world]
ci_lanes = ["world", "architecture_integrity"]
paths = ["environment/src/environment/**", "environment/tests/**", "lab/src/lab/world/**", "lab/src/lab/integration/world/**"]

[observatory]
ci_lanes = ["observatory", "architecture_integrity"]
# The launchers that publish to the Observatory live in the Lab; their contract
# suite is lab/src/lab/observatory/tests, so a change to them must select this lane too.
paths = ["lab/src/lab/observatory/**", "lab/src/lab/cli/observed_*.py"]

[experiment_protocol]
ci_lanes = ["experiment_mechanics", "architecture_integrity"]
paths = ["lab/experiments/**", "lab/src/lab/studies/**", "docs/design/**", "lab/research/**"]

[tests]
ci_lanes = ["canonical_full"]
paths = ["tests/**"]
