[[artifact]]
path_glob = ".github/workflows/**"
class = "governance-control-plane"
rule = "external-review-required"

[[artifact]]
path_glob = ".github/CODEOWNERS"
class = "governance-control-plane"
rule = "external-review-required"

[[artifact]]
path_glob = ".github/pull_request_template.md"
