[[artifact]]
path_glob = ".codex/**"
class = "governance-control-plane"
rule = "external-review-required"

[[artifact]]
path_glob = "pyproject.toml"
class = "governance-control-plane"
rule = "external-review-required"

[[artifact]]
path_glob = "pyrightconfig.json"
class = "governance-control-plane"
rule = "external-review-required"

[[artifact]]
path_glob = "docs/roadmap.md"
class = "governance-control-plane"
rule = "external-review-required"

[[artifact]]
