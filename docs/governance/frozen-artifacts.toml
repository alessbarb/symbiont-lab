schema_version = 1

[[artifact]]
path_glob = "AGENTS.md"
class = "governance"
minimum_authority = "L4"

[[artifact]]
path_glob = "CLAUDE.md"
class = "governance"
minimum_authority = "L4"

[[artifact]]
path_glob = "docs/governance/**"
class = "governance"
minimum_authority = "L4"

[[artifact]]
path_glob = "docs/roadmap.md"
class = "project-direction"
minimum_authority = "L4"

[[artifact]]
path_glob = "experiments/**/results.json"
class = "scientific-result"
minimum_authority = "L4"
rule = "append-or-supersede; do not rewrite completed evidence"

[[artifact]]
path_glob = "experiments/embodiment/label-invariance/experiment.toml"
class = "preregistered-protocol"
minimum_authority = "L4"

[[artifact]]
path_glob = "docs/design/vision/visual-acquisition-v1.md"
class = "active-preregistration"
minimum_authority = "L3"
rule = "frozen criteria do not move because of observed data"
