repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: ruff check --output-format=concise
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check
        language: system
        types: [python]
      - id: pyright
        name: Pyright
        entry: pyright
        language: system
        pass_filenames: false
        stages: [manual]
