repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check and safe fix
        entry: ruff check --fix --output-format=concise
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: pyright
        name: Pyright
        entry: pyright
        language: system
        pass_filenames: false
        stages: [manual]
