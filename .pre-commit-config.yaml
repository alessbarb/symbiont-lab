repos:
  - repo: local
    hooks:
      - id: governance-check
        name: Repository governance authority check
        entry: python scripts/agentctl.py check --staged --manifest .agent-session.toml
        language: system
        pass_filenames: false
      - id: governance-verify
        name: Repository governance verification
        entry: python scripts/agentctl.py verify
        language: system
        pass_filenames: false
      - id: ruff-check
        name: Ruff check
        entry: ruff check --output-format=concise
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check
        language: system
        types: [python]
      - id: pyright
        name: Pyright
        entry: pyright
        language: system
        pass_filenames: false
        stages: [manual]
