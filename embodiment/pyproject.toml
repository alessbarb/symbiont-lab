[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodiment"
version = "0.90.0"
description = "Embodiment domain: couplings between the organism and a concrete form of existence"
requires-python = ">=3.12"
dependencies = ["modality"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["embodiment*"]

[tool.uv.sources]
modality = { workspace = true }
