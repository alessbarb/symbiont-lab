schema_version = 1

[experiment]
id = "learning.embodied-behavioral-ablation"
title = "Matched-twin cognitive motor behavioral ablation"
protocol = "learning.embodied-behavioral-ablation"
protocol_version = 5
hypothesis = """
If learned cognitive motor structure has causal behavioral utility, Physics3D
v1
twins restored from the same organism checkpoint and the same physical state
should show condition-dependent behavior when learned graph edges feeding
cognitive motor and primitive readouts are retained, removed, or remapped
within their output family.
"""
success_criteria = """
First require a naturally used cognitive motor output during warmup: direct
cognition, mixed cognition, or a primitive whose replay source is cognition.
Merely having a cognitively eligible primitive or primitive readout node is not
a trigger. If no actual cognitive motor use appears, report the seed as not
causally testable rather than success or failure. For testable seeds, freeze cognitive learning in all twins and preserve all
non-motor cognitive structure, physiology, sensorimotor learning and body state.
Compare the intact twin with removed and within-family shuffled cognitive
motor-output controls when each control is structurally applicable. Report
effect sizes per seed without imposing a post-hoc direction or threshold.
A second graph-tick delay is intentionally excluded because resident learned
motor-output edges already use the canonical maximum delay_ticks=1.
"""

[world]
steps = 3000

[design]
seeds = [101, 127, 149]

[ablation]
horizon_ticks = 256

[output]
save_trace = false
save_summary = true
