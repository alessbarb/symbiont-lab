schema_version = 1

[experiment]
id = "learning.canonical-sensorimotor-adaptation"
title = "Opaque body-model reorganization after actuator damage"
protocol = "learning.canonical-sensorimotor-adaptation"
protocol_version = 1
hypothesis = """
After an organism has discovered an opaque motor primitive, disabling the
physical actuator implicated by that replay will change its subsequent sensory
trajectory and cause its organism-owned sensorimotor model to reorganize,
including discovery of new temporal chunks, without an external task signal.
"""
success_criteria = """
For every seed, the intact continuation must deliver the selected actuator,
the damaged continuation must not deliver it, both must start from the same
checkpoint, a pre-damage primitive must be replayed in the changed body, the
sensory trajectories must diverge, and the damaged learner's primitive model
must differ from the intact matched twin, contain a multi-effector chunk and
replay at least one newly discovered primitive. No reward, goal, semantic label
or evaluator ground truth may enter the organism.
"""

[world]
steps = 32

[design]
seeds = [101, 127, 149]

[adaptation]
horizon_ticks = 96

[output]
save_trace = false
save_summary = true
