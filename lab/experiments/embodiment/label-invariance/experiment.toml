[experiment]
id = "embodiment.label-invariance"
title = "E8 Label Invariance"
protocol = "embodiment.label-invariance"
protocol_version = 1
hypothesis = """
Evaluator-side and human-readable body/port labels are causally irrelevant to
the subject. Physically identical bodies with identical ordinals and mechanics
must produce identical opaque and internal trajectories.
"""
