schema_version = 1

[experiment]
id = "learning.temporal-private-model-controls"
title = "Temporal private-model causal controls"
protocol = "learning.temporal-private-model-controls"
protocol_version = 2
hypothesis = """
Temporal mechanisms trained on embodied temporal transitions should gain
predictive utility only when the causal alignment
state(t) + action(t) -> state(t+1) is intact. GRU, stationary VOMM and decayed
VOMM are evaluated under the same action-shuffled, next-state-shuffled and
no-action controls. No mechanism is assigned a cognitive role by this study.
"""
success_criteria = """
Report causal-control margins separately for GRU, stationary VOMM and decayed
VOMM. A mechanism supports the causal interpretation only when, on every
preregistered seed, its intact causal gain exceeds action-shuffled,
next-state-shuffled and no-action controls. Results are retained even when a
criterion fails and are not tuned post hoc.
"""

[world]
steps = 256

[design]
seeds = [101, 127, 149]

[output]
save_trace = false
save_summary = true
