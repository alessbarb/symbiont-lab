schema_version = 1

[experiment]
id = "learning.temporal-private-model-controls"
title = "Temporal private-model causal controls"
protocol = "learning.temporal-private-model-controls"
protocol_version = 1
hypothesis = """
A private model trained on embodied temporal transitions should gain predictive
utility only when the causal alignment state(t) + action(t) -> state(t+1) is intact.
Breaking action identity or next-state alignment should reduce held-out gain, and
removing action should reduce utility when action is necessary for the transition.
"""
success_criteria = """
For every preregistered seed, causal gain over the best trivial baseline must exceed
the gain measured in action-shuffled, next-state-shuffled and no-action controls.
Results are retained even when a criterion fails and are not tuned post hoc.
"""

[world]
steps = 256

[design]
seeds = [101, 127, 149]

[output]
save_trace = false
save_summary = true
