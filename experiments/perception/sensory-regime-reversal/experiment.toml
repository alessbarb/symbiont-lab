schema_version = 1

[experiment]
id = "perception.sensory-regime-reversal"
title = "Sensory Regime Reversal"
protocol = "perception.sensory-regime-reversal"
protocol_version = 1
hypothesis = """
When the world changes from a fast-change regime to a slow-integrative regime, organism-side sensory preference changes from the previously useful receptor to the newly useful receptor without evaluator intervention.
"""
success_criteria = """
Use only preregistered organism-side selection metrics and evaluator-side held-out characterization. Do not feed target labels or post-hoc best roles into the organism.
"""
notes = "Candidate transforms are available before evaluation; evaluator labels are applied only after organism-side selection."

[world]
steps = 320

[design]
seeds = [101, 127, 149]

[output]
save_trace = false
save_summary = true
