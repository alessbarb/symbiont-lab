name: CI

on:
  push:
    branches: [main, refactor/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-tests:
    name: software-tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest tests/unit tests/integration -q

  experimental-integrity:
    name: experimental-integrity (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest tests/experimental_integrity -q

  regression:
    name: regression (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest tests/regression -q

  smoke:
    name: smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest tests/smoke -q
      - run: symbiont-lab simulate --hosts 10 --steps 20 --seed 1
      - run: symbiont-lab audit verify
      - run: symbiont-lab experiment run experiments/attention/causal-v0242-revalidation/experiment.toml
      - run: symbiont-lab study run attention.replicated --seeds 101,127

  host-cross-platform:
    name: host-cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - shell: bash
        run: python -m pip install --upgrade pip
      - shell: bash
        run: pip install -e '.[dev]'
      - shell: bash
        run: pytest tests/unit/host tests/unit/core -k "host or checkpoint or organism or governor or runtime or capsule" -q
      - shell: bash
        run: symbiont-lab host discover
      - shell: bash
        run: symbiont-lab host sample
      - shell: bash
        run: symbiont-lab organism run --ticks 2 --min-samples 1

  host-constrained-environment:
    name: host-constrained-environment (alpine/musl)
    runs-on: ubuntu-latest
    container:
      image: python:3.12-alpine
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache gcc musl-dev libffi-dev openssl-dev cargo rust
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest tests/unit/host -q
      - run: symbiont-lab host discover
      - run: symbiont-lab host sample

  legacy-compatibility:
    name: legacy-compatibility (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: symbiont-sim --hosts 30 --steps 140 --seed 11 --no-record
      - run: symbiont-generations --generations 2 --hosts 10 --steps 80 --seed 11 --threat-rate 0
      - run: symbiont-budget --hosts 12 --steps 90 --seed 11 --threat-rate 0.05
      - run: symbiont-causal-budget --hosts 12 --steps 90 --seed 11 --threat-rate 0.05 --budget-per-1000 15
      - run: symbiont-causal-budget-study --seeds 101,127 --budgets-per-1000 8,16 --hosts 8 --steps 70 --threat-rate 0.05
      - run: symbiont-evidence --hosts 12 --steps 90 --seed 11 --threat-rate 0.05 --budget 20
      - run: symbiont-evidence-study --seeds 3,7 --hosts 10 --steps 80 --threat-rate 0.05 --budget 15
      - run: symbiont-evidence-noise-sweep --seeds 211,223 --noise-levels 0.08,0.30 --hosts 8 --steps 70 --threat-rate 0.05 --budget-per-1000 15
      - run: symbiont-heritage-stress --source-seed 3 --target-seed 1012 --hosts 14 --steps 100 --threat-rate 0.06 --heritage-limit 8
      - run: symbiont-heritage-stress-study --source-seeds 3,7 --target-offset 1009 --hosts 10 --steps 80 --threat-rate 0.05 --heritage-limit 6
