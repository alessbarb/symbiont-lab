name: CI

on:
  push:
    branches: [main, refactor/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality-and-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python scripts/agentctl.py verify
      - name: Audit commit authority
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
        run: |
          BASE="$PUSH_BASE"
          HEAD="$HEAD_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse "$HEAD^")"
          fi
          python scripts/agentctl.py ci-check --base "$BASE" --head "$HEAD" --actor "$GITHUB_ACTOR_NAME"
      - run: pytest tests/governance tests/docs -q
      - run: ruff check src/ observatory/ tests/
      - run: ruff format --check src/ observatory/ tests/
      - run: bandit -r src/ -ll

  contracts:
    name: contracts (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -o addopts= tests/contract tests/compatibility tests/experiments -q

  software-tests:
    name: software-tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest tests/unit tests/integration -q

  experimental-integrity:
    name: experimental-integrity (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -o addopts= tests/experimental_integrity -q

  regression:
    name: regression (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest tests/regression -q

  observatory:
    name: observatory (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest observatory -q

  smoke:
    # These executions verify CLI/protocol mechanics only. They are not scientific
    # campaigns and MUST NOT be used to elevate research claims.
    name: smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest tests/smoke -q
      - run: symbiont-lab simulate --hosts 10 --steps 20 --seed 1
      - run: symbiont-lab audit verify
      - run: symbiont-lab experiment run experiments/attention/causal-v0242-revalidation/experiment.toml
      - run: symbiont-lab study run attention.replicated --seeds 101,127

  host-cross-platform:
    name: host-cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - shell: bash
        run: python -m pip install --upgrade pip
      - shell: bash
        run: pip install -e '.[dev]'
      - shell: bash
        run: pytest tests/unit/host tests/unit/core -k "host or checkpoint or organism or governor or runtime or capsule" -q
      - shell: bash
        run: symbiont-lab host discover
      - shell: bash
        run: symbiont-lab host sample
      - shell: bash
        run: symbiont-lab organism run --ticks 2 --min-samples 1

  host-constrained-environment:
    name: host-constrained-environment (alpine/musl)
    runs-on: ubuntu-latest
    container:
      image: python:3.12-alpine
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache gcc musl-dev libffi-dev openssl-dev cargo rust
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest tests/unit/host -q
      - run: symbiont-lab host discover
      - run: symbiont-lab host sample

  canonical-cli-protocols:
    # Mechanical protocol regression only; results produced here are not scientific
    # evidence because CI is not a preregistered campaign environment.
    name: canonical-cli-protocols (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: symbiont-lab simulate --hosts 30 --steps 140 --seed 11
      - run: symbiont-lab study run heritage.longitudinal --seed 11 --generations 2 --hosts 10 --steps 80
      - run: symbiont-lab study run attention.retrospective --seed 11 --hosts 12 --steps 90
      - run: symbiont-lab study run attention.causal --seed 11 --hosts 12 --steps 90
      - run: symbiont-lab study run attention.replicated --seeds 101,127 --hosts 8 --steps 70
      - run: symbiont-lab study run evidence.second-look --seed 11 --hosts 12 --steps 90
      - run: symbiont-lab study run evidence.replicated --seeds 3,7 --hosts 10 --steps 80
      - run: symbiont-lab study run evidence.noise-sweep --seeds 211,223 --hosts 8 --steps 70
      - run: symbiont-lab study run heritage.stress --seed 3 --hosts 14 --steps 100
      - run: symbiont-lab study run heritage.replicated --seeds 3,7 --hosts 10 --steps 80
      - run: symbiont-lab study compare --parameter threat_rate --baseline 0.01 --variant 0.03 --seeds 3,7 --hosts 10 --steps 60 --no-record


  performance-report:
    name: performance-report (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Run P8 quick reprofile
        run: python scripts/reprofile_performance.py --quick --output-dir .artifacts/p8
      - name: Upload P8 performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-performance-${{ github.sha }}
          path: .artifacts/p8/
          if-no-files-found: warn
          retention-days: 30
