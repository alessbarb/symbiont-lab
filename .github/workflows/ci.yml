name: CI

on:
  push:
    branches: [main, refactor/*, agentctl/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: validation-plan
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.plan.outputs.classification }}
      docs: ${{ steps.plan.outputs.docs }}
      governance: ${{ steps.plan.outputs.governance }}
      software_core: ${{ steps.plan.outputs.software_core }}
      world: ${{ steps.plan.outputs.world }}
      observatory: ${{ steps.plan.outputs.observatory }}
      architecture_integrity: ${{ steps.plan.outputs.architecture_integrity }}
      runtime_contracts: ${{ steps.plan.outputs.runtime_contracts }}
      experiment_mechanics: ${{ steps.plan.outputs.experiment_mechanics }}
      canonical_full: ${{ steps.plan.outputs.canonical_full }}
      physics3d: ${{ steps.plan.outputs.physics3d }}
      modeling: ${{ steps.plan.outputs.modeling }}
      python_compat: ${{ steps.plan.outputs.python_compat }}
      host_portability: ${{ steps.plan.outputs.host_portability }}
      alpine: ${{ steps.plan.outputs.alpine }}
      protocol_mechanics: ${{ steps.plan.outputs.protocol_mechanics }}
      performance: ${{ steps.plan.outputs.performance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Build governed validation plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          BASE="$PUSH_BASE"
          HEAD="$HEAD_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse "$HEAD^")"
          fi
          python scripts/governance/ci_plan.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"

  quality:
    name: code-quality-and-governance
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: core
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync python scripts/agentctl.py verify
      - run: git diff --check
      - name: Audit governed publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          BASE="$PUSH_BASE"
          HEAD="$HEAD_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse "$HEAD^")"
          fi
          uv run --no-sync python scripts/agentctl.py ci-check --base "$BASE" --head "$HEAD"
      - run: uv run --no-sync ruff check src/ observatory/ tests/ scripts/governance/ci_plan.py
      - run: uv run --no-sync ruff format --check src/ observatory/ tests/ scripts/governance/ci_plan.py
      - run: uv run --no-sync bandit -r src/ -ll

  governance-docs:
    name: governance-and-docs-tests
    needs: plan
    if: needs.plan.outputs.governance == 'true' || needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: core
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest tests/governance tests/docs -q

  software-core:
    name: software-core (py3.12)
    needs: plan
    if: needs.plan.outputs.software_core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: core
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest tests/unit tests/integration -q --ignore=tests/integration/test_equivalence_suite.py
      - run: uv run --no-sync pytest tests/regression -q
      - run: uv run --no-sync pytest tests/smoke -q

  physics3d-tests:
    name: physics3d-tests (py3.12)
    needs: plan
    if: needs.plan.outputs.physics3d == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv physics cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: physics
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen --extra dev --extra physics3d
      - run: uv run --no-sync pytest tests/unit/lab/physics3d tests/integration/test_physics3d_*.py tests/integration/test_equivalence_suite.py -q

  modeling-tests:
    name: modeling-tests (py3.12)
    needs: plan
    if: needs.plan.outputs.modeling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv modeling cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: modeling
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen --extra dev --extra modeling
      - run: >-
          uv run --no-sync pytest
          tests/unit/modeling
          tests/unit/lab/modeling
          tests/integration/test_private_model_training.py
          tests/integration/test_private_model_learnability.py
          tests/integration/test_private_model_adaptation.py
          tests/integration/test_training_ancestry_end_to_end.py
          -q

  world-tests:
    name: world-tests (py3.12)
    needs: plan
    if: needs.plan.outputs.world == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: core
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest tests/unit/world tests/unit/lab/world -q

  observatory-tests:
    name: observatory-tests (py3.12)
    needs: plan
    if: needs.plan.outputs.observatory == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: core
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest observatory tests/unit/observatory tests/unit/workbench -q

  architecture-integrity:
    name: architecture-integrity
    needs: plan
    if: needs.plan.outputs.architecture_integrity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: core
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest -o addopts= tests/experimental_integrity -q

  runtime-contracts:
    name: runtime-contracts
    needs: plan
    if: needs.plan.outputs.runtime_contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: core
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest -o addopts= tests/contract tests/compatibility -q

  experiment-mechanics:
    name: experiment-mechanics
    needs: plan
    if: needs.plan.outputs.experiment_mechanics == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: core
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest -o addopts= tests/experiments -q

  canonical-full:
    name: canonical-full (py3.12)
    needs: plan
    if: needs.plan.outputs.canonical_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: physics
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen --extra dev --extra physics3d
      - run: uv run --no-sync pytest -o addopts= tests -q
      - run: uv run --no-sync pytest observatory -q

  python-compatibility:
    name: python-compatibility (py${{ matrix.python-version }})
    needs: plan
    if: needs.plan.outputs.python_compat == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup uv cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-suffix: core
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest -o addopts= tests/contract tests/compatibility tests/experimental_integrity -q
      - run: uv run --no-sync pytest tests/smoke -q
      - run: uv run --no-sync symbiont-lab audit verify

  host-portability:
    name: host-portability (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.host_portability == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: core
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - shell: bash
        run: uv sync --frozen --extra dev
      - shell: bash
        run: uv run --no-sync pytest tests/unit/host tests/unit/core -k "host or checkpoint or organism or governor or runtime or capsule" -q
      - shell: bash
        run: uv run --no-sync symbiont-lab host discover
      - shell: bash
        run: uv run --no-sync symbiont-lab host sample
      - shell: bash
        run: uv run --no-sync symbiont-lab organism run --ticks 2 --min-samples 1

  host-constrained:
    name: host-constrained (alpine/musl)
    needs: plan
    if: needs.plan.outputs.alpine == 'true'
    runs-on: ubuntu-latest
    container:
      image: python:3.12-alpine
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache gcc musl-dev libffi-dev openssl-dev cargo rust
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest tests/unit/host -q
      - run: symbiont-lab host discover
      - run: symbiont-lab host sample

  protocol-mechanics:
    name: protocol-mechanics (py3.12)
    needs: plan
    if: needs.plan.outputs.protocol_mechanics == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: core
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync symbiont-lab simulate --hosts 30 --steps 140 --seed 11
      - run: uv run --no-sync symbiont-lab study run heritage.longitudinal --seed 11 --generations 2 --hosts 10 --steps 80
      - run: uv run --no-sync symbiont-lab study run attention.causal --seed 11 --hosts 12 --steps 90
      - run: uv run --no-sync symbiont-lab study run evidence.replicated --seeds 3,7 --hosts 10 --steps 80
      - run: uv run --no-sync symbiont-lab study compare --parameter threat_rate --baseline 0.01 --variant 0.03 --seeds 3,7 --hosts 10 --steps 60 --no-record


  governed-ci-gate:
    name: governed-ci-gate
    if: always()
    needs:
      - plan
      - quality
      - governance-docs
      - software-core
      - physics3d-tests
      - modeling-tests
      - world-tests
      - observatory-tests
      - architecture-integrity
      - runtime-contracts
      - experiment-mechanics
      - canonical-full
      - python-compatibility
      - host-portability
      - host-constrained
      - protocol-mechanics
    runs-on: ubuntu-latest
    env:
      PLAN_RESULT: ${{ needs.plan.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}

      DOCS_EXPECTED: ${{ needs.plan.outputs.docs }}
      GOVERNANCE_EXPECTED: ${{ needs.plan.outputs.governance }}
      GOVERNANCE_DOCS_RESULT: ${{ needs.governance-docs.result }}

      SOFTWARE_CORE_EXPECTED: ${{ needs.plan.outputs.software_core }}
      SOFTWARE_CORE_RESULT: ${{ needs.software-core.result }}

      PHYSICS3D_EXPECTED: ${{ needs.plan.outputs.physics3d }}
      PHYSICS3D_RESULT: ${{ needs.physics3d-tests.result }}

      MODELING_EXPECTED: ${{ needs.plan.outputs.modeling }}
      MODELING_RESULT: ${{ needs.modeling-tests.result }}

      WORLD_EXPECTED: ${{ needs.plan.outputs.world }}
      WORLD_RESULT: ${{ needs.world-tests.result }}

      OBSERVATORY_EXPECTED: ${{ needs.plan.outputs.observatory }}
      OBSERVATORY_RESULT: ${{ needs.observatory-tests.result }}

      ARCHITECTURE_EXPECTED: ${{ needs.plan.outputs.architecture_integrity }}
      ARCHITECTURE_RESULT: ${{ needs.architecture-integrity.result }}

      RUNTIME_EXPECTED: ${{ needs.plan.outputs.runtime_contracts }}
      RUNTIME_RESULT: ${{ needs.runtime-contracts.result }}

      EXPERIMENT_EXPECTED: ${{ needs.plan.outputs.experiment_mechanics }}
      EXPERIMENT_RESULT: ${{ needs.experiment-mechanics.result }}

      CANONICAL_EXPECTED: ${{ needs.plan.outputs.canonical_full }}
      CANONICAL_RESULT: ${{ needs.canonical-full.result }}

      PYTHON_COMPAT_EXPECTED: ${{ needs.plan.outputs.python_compat }}
      PYTHON_COMPAT_RESULT: ${{ needs.python-compatibility.result }}

      HOST_PORTABILITY_EXPECTED: ${{ needs.plan.outputs.host_portability }}
      HOST_PORTABILITY_RESULT: ${{ needs.host-portability.result }}

      ALPINE_EXPECTED: ${{ needs.plan.outputs.alpine }}
      ALPINE_RESULT: ${{ needs.host-constrained.result }}

      PROTOCOL_EXPECTED: ${{ needs.plan.outputs.protocol_mechanics }}
      PROTOCOL_RESULT: ${{ needs.protocol-mechanics.result }}
    steps:
      - name: Verify governed validation plan completed
        shell: bash
        run: |
          set -euo pipefail

          require_success() {
            local name="$1"
            local actual="$2"
            if [ "$actual" != "success" ]; then
              echo "::error::$name must succeed; got $actual"
              exit 1
            fi
          }

          require_lane() {
            local name="$1"
            local expected="$2"
            local actual="$3"

            if [ "$expected" = "true" ]; then
              if [ "$actual" != "success" ]; then
                echo "::error::$name was selected by validation-plan but finished as $actual"
                exit 1
              fi
              return
            fi

            if [ "$actual" != "skipped" ] && [ "$actual" != "success" ]; then
              echo "::error::$name was not selected but finished as $actual"
              exit 1
            fi
          }

          require_success "validation-plan" "$PLAN_RESULT"
          require_success "code-quality-and-governance" "$QUALITY_RESULT"

          GOVERNANCE_DOCS_EXPECTED=false
          if [ "$GOVERNANCE_EXPECTED" = "true" ] || [ "$DOCS_EXPECTED" = "true" ]; then
            GOVERNANCE_DOCS_EXPECTED=true
          fi

          require_lane "governance-and-docs-tests" "$GOVERNANCE_DOCS_EXPECTED" "$GOVERNANCE_DOCS_RESULT"
          require_lane "software-core (py3.12)" "$SOFTWARE_CORE_EXPECTED" "$SOFTWARE_CORE_RESULT"
          require_lane "physics3d-tests (py3.12)" "$PHYSICS3D_EXPECTED" "$PHYSICS3D_RESULT"
          require_lane "modeling-tests (py3.12)" "$MODELING_EXPECTED" "$MODELING_RESULT"
          require_lane "world-tests (py3.12)" "$WORLD_EXPECTED" "$WORLD_RESULT"
          require_lane "observatory-tests (py3.12)" "$OBSERVATORY_EXPECTED" "$OBSERVATORY_RESULT"
          require_lane "architecture-integrity" "$ARCHITECTURE_EXPECTED" "$ARCHITECTURE_RESULT"
          require_lane "runtime-contracts" "$RUNTIME_EXPECTED" "$RUNTIME_RESULT"
          require_lane "experiment-mechanics" "$EXPERIMENT_EXPECTED" "$EXPERIMENT_RESULT"
          require_lane "canonical-full (py3.12)" "$CANONICAL_EXPECTED" "$CANONICAL_RESULT"
          require_lane "python-compatibility" "$PYTHON_COMPAT_EXPECTED" "$PYTHON_COMPAT_RESULT"
          require_lane "host-portability" "$HOST_PORTABILITY_EXPECTED" "$HOST_PORTABILITY_RESULT"
          require_lane "host-constrained (alpine/musl)" "$ALPINE_EXPECTED" "$ALPINE_RESULT"
          require_lane "protocol-mechanics (py3.12)" "$PROTOCOL_EXPECTED" "$PROTOCOL_RESULT"

          echo "governed CI gate: PASS"

  performance-report:
    name: performance-report (informational)
    needs: plan
    if: needs.plan.outputs.performance == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.12'
          cache-suffix: core
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync python scripts/reprofile_performance.py --quick --output-dir .artifacts/p8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-performance-${{ github.sha }}
          path: .artifacts/p8/
          if-no-files-found: warn
          retention-days: 30
