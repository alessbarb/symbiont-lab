name: Server refactor validation

on:
  push:
    branches: [refactor/server-architecture]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m compileall -q             observatory/server.py             src/symbiont_lab/app/physics3d_session.py             src/symbiont_lab/observation             src/symbiont_lab/server             src/symbiont_lab/workbench/runs.py             tests/unit/lab/test_run_coordinator.py             tests/unit/lab/physics3d/test_session.py             tests/smoke/test_runtime_stream_adapter.py             tests/smoke/test_unified_server.py             observatory/tests/test_server.py
      - run: node --check src/symbiont_lab/workbench/web/views/mind/streams.js

  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: |
          pytest -q             tests/unit/lab/test_run_coordinator.py             tests/unit/lab/physics3d/test_session.py             tests/smoke/test_runtime_stream_adapter.py             tests/smoke/test_unified_server.py             observatory/tests/test_server.py             observatory/tests/test_evidence_endpoints.py             observatory/tests/test_adversarial_hardening.py
