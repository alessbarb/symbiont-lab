name: Research Experiment

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment TOML under experiments/"
        required: true
        default: "experiments/evidence/causal-budget-v027/experiment.toml"
        type: string
      python-version:
        description: "Python version"
        required: true
        default: "3.12"
        type: choice
        options:
          - "3.11"
          - "3.12"
          - "3.13"

permissions:
  contents: read

jobs:
  research:
    name: canonical research run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPERIMENT: ${{ inputs.experiment }}
    steps:
      - name: Require canonical main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Canonical research runs must be dispatched from main; got ${GITHUB_REF}" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install research environment
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Validate experiment path
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ["EXPERIMENT"].strip()
          path = Path(raw)
          if not raw:
              raise SystemExit("experiment path is empty")
          if path.is_absolute() or ".." in path.parts:
              raise SystemExit("experiment must be a relative path without '..'")
          if not path.parts or path.parts[0] != "experiments":
              raise SystemExit("experiment must live under experiments/")
          if path.suffix != ".toml":
              raise SystemExit("experiment must be a .toml file")
          if not path.is_file():
              raise SystemExit(f"experiment file not found: {path}")
          print(f"Validated experiment: {path}")
          PY

      - name: Verify experimental invariants
        run: symbiont-lab audit verify

      - name: Execute experiment
        run: symbiont-lab experiment run "$EXPERIMENT"

      - name: Identify canonical run
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          runs = Path(".symbiont/runs")
          candidates = [path for path in runs.iterdir() if path.is_dir() and (path / "manifest.json").is_file()]
          if not candidates:
              raise SystemExit("experiment did not produce a manifest")
          run_dir = max(candidates, key=lambda path: path.stat().st_mtime_ns)
          payload = {
              "git_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "experiment": os.environ["EXPERIMENT"],
              "run_dir": str(run_dir),
              "manifest": str(run_dir / "manifest.json"),
          }
          Path(".symbiont/research-run.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"CANONICAL_MANIFEST={run_dir / 'manifest.json'}\n")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Reproduce canonical run
        run: symbiont-lab reproduce "$CANONICAL_MANIFEST"

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbiont-research-${{ github.run_id }}
          path: |
            .symbiont/runs/
            .symbiont/research-run.json
            ${{ inputs.experiment }}
          if-no-files-found: error
          retention-days: 90
