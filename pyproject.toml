[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiont-lab"
version = "0.76.6"
description = "Safe self-developing local digital organism and scientific research apparatus"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
symbiont-lab = "symbiont_lab.cli.main:main"
symbiont-sim = "symbiont_lab.compat.legacy_cli:sim_main"
symbiont-dashboard = "symbiont_lab.compat.legacy_cli:dashboard_main"
symbiont-study = "symbiont_lab.compat.legacy_cli:study_main"
symbiont-campaign = "symbiont_lab.compat.legacy_cli:campaign_main"
symbiont-generations = "symbiont_lab.compat.legacy_cli:generations_main"
symbiont-budget = "symbiont_lab.compat.legacy_cli:budget_main"
symbiont-causal-budget = "symbiont_lab.compat.legacy_cli:causal_budget_main"
symbiont-causal-budget-study = "symbiont_lab.compat.legacy_cli:causal_budget_study_main"
symbiont-evidence = "symbiont_lab.compat.legacy_cli:evidence_main"
symbiont-evidence-study = "symbiont_lab.compat.legacy_cli:evidence_study_main"
symbiont-evidence-noise-sweep = "symbiont_lab.compat.legacy_cli:evidence_noise_sweep_main"
symbiont-heritage-stress = "symbiont_lab.compat.legacy_cli:heritage_stress_main"
symbiont-heritage-stress-study = "symbiont_lab.compat.legacy_cli:heritage_stress_study_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"symbiont.cognition" = ["defaults/*.json"]
