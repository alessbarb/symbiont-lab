[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiont-lab"
version = "1.0.0"
description = "Safe self-developing local digital organism and scientific research apparatus"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]
modeling = ["torch>=2.4,<3"]
viewer = ["pygame>=2.6,<3"]

[project.scripts]
symbiont-lab = "symbiont_lab.cli.main:main"
symbiont-world = "symbiont_lab.cli.world:main"
symbiont-world-viewer = "symbiont_lab.viewer.world_pygame:main"

[tool.pytest.ini_options]
norecursedirs = ["backups", ".claude"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["symbiont*", "symbiont_lab*", "symbiont_world*", "observatory*"]
exclude = ["tests*", "observatory.tests*", "research*", "docs*", "scripts*"]

[tool.setuptools.package-data]
"symbiont.cognition" = ["defaults/*.json"]
"observatory" = [
  "*.html",
  "*.css",
  "*.js",
  "*.json",
  "communication/*.js",
  "projection/*.js",
  "render/*.js",
  "state/*.js",
  "transport/*.js",
  "ui/*.js",
  "schemas/*.json",
]
