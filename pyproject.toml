[project]
name = "symbiont-lab"
version = "0.90.0"
description = "Safe self-developing local digital organism and scientific research apparatus"
requires-python = ">=3.12"
dependencies = ["lab"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.5",
  "ruff>=0.16",
  "pyright>=1.1.404",
  "coverage>=7.10",
  "bandit[toml]>=1.8",
  "pip-audit>=2.9",
  "hypothesis>=6.0",
  "mutmut>=3.3",
  "pre-commit>=4.0",
  "import-linter>=2.0",
]
modeling = ["lab[modeling]"]
physics3d = ["lab[physics3d]"]

[tool.pytest.ini_options]
norecursedirs = ["backups", ".claude", "archive"]
testpaths = ["tests", "lab/src/lab/observatory/tests"]
addopts = "-m 'not slow'"
markers = [
  "experiment_contract: mechanical contract for an experiment protocol or runner",
  "slow: test intentionally exercises a longer or more expensive path",
  "superseded(by, reason): archived test replaced by the canonical test named in `by`",
]

[tool.ruff]
target-version = "py312"
src = ["symbiont/src", "environment/src", "modality/src", "embodiment/src", "lab/src"]
line-length = 100
extend-exclude = [".claude", "backups", "lab/experiments", "graphify-out", "lab/research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
branch = true
parallel = true
source = ["symbiont/src", "environment/src", "modality/src", "embodiment/src", "lab/src"]
omit = [
  "*/__pycache__/*",
  "*/tests/*",
  "*/test_*.py",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
skip_covered = true
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "lab/experiments", "lab/research", ".claude", "backups"]
# TODO(security): replace these global skips with per-file or per-line evidence
# once the affected invariants and cleanup paths have been reviewed. These
# findings are intentional in this deterministic research runtime: asserts
# guard internal invariants, pseudo-randomness is simulation input (not secrets),
# string literals are protocol tokens, and best-effort cleanup is non-critical.
skips = ["B101", "B105", "B106", "B110", "B112", "B311"]

# Five-domain layout: organism, environment, modality, embodiment and lab are
# independent distributions. This root is only the workspace that binds them.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["symbiont", "environment", "modality", "embodiment", "lab"]

[tool.uv.sources]
lab = { workspace = true }

# Architectural invariants, checked with `lint-imports`.
[tool.importlinter]
root_packages = ["symbiont", "embodiment", "modality", "environment", "lab"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The four domain libraries are mutually independent"
type = "independence"
modules = ["symbiont", "embodiment", "modality", "environment"]

[[tool.importlinter.contracts]]
name = "Domain libraries do not depend on the Lab"
type = "forbidden"
source_modules = ["symbiont", "embodiment", "modality", "environment"]
forbidden_modules = ["lab"]

[[tool.importlinter.contracts]]
name = "Heavy numeric and physics libraries are imported only by the Lab"
type = "forbidden"
source_modules = ["symbiont", "embodiment", "modality", "environment"]
forbidden_modules = ["pybullet", "torch", "numpy", "PIL"]
