[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiont-lab"
version = "1.0.0"
description = "Safe self-developing local digital organism and scientific research apparatus"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "rich>=13"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.13",
  "pyright>=1.1.414",
  "coverage>=7.10",
  "bandit[toml]>=1.8",
  "pip-audit>=2.9",
  "hypothesis>=6.0",
  "mutmut>=3.3",
  "pre-commit>=4.0",
]
modeling = ["torch>=2.4,<3"]
physics3d = ["pybullet>=3.2.7,<4", "torch>=2.4,<3", "numpy>=1.26,<3", "pillow>=10,<13"]

[project.scripts]
symbiont-lab = "symbiont_lab.cli.main:main"
symbiont-lab-gui = "symbiont_lab.app.main:main"
symbiont-world = "symbiont_lab.cli.world:main"
symbiont-body-3d = "symbiont_lab.physics3d.cli:main"
symbiont-physics-audit = "symbiont_lab.studies.physics3d.constitution_audit:main"
symbiont-reembodiment-study = "symbiont_lab.studies.embodiment.reembodiment_cli:main"
symbiont-telemetry-benchmark = "symbiont_lab.physics3d.telemetry_cli:benchmark_main"
symbiont-telemetry-convert = "symbiont_lab.physics3d.telemetry_cli:convert_main"

[tool.pytest.ini_options]
norecursedirs = ["backups", ".claude"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
  "experiment_contract: mechanical contract for an experiment protocol or runner",
  "slow: test intentionally exercises a longer or more expensive path",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".claude", "backups", "experiments", "graphify-out", "research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
branch = true
parallel = true
source = ["src", "observatory"]
omit = [
  "*/__pycache__/*",
  "*/tests/*",
  "*/test_*.py",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
skip_covered = true
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "experiments", "research", ".claude", "backups"]
# These findings are intentional in this deterministic research runtime: asserts
# guard internal invariants, pseudo-randomness is simulation input (not secrets),
# string literals are protocol tokens, and best-effort cleanup is non-critical.
skips = ["B101", "B105", "B106", "B110", "B112", "B311"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["symbiont*", "symbiont_lab*", "symbiont_world*", "observatory*"]
exclude = ["tests*", "observatory.tests*", "research*", "docs*", "scripts*"]

[tool.setuptools.package-data]
"symbiont.cognition" = ["defaults/*.json"]
"symbiont.genetics" = ["defaults/*.json"]
"symbiont_lab.workbench" = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/views/*.js",
  "web/views/body/*.js",
  "web/views/lab/*.js",
  "web/views/archive/*.js",
  "web/views/shared/*.js",
  "web/views/mind/*.js",
]
"observatory" = [
  "*.html",
  "*.css",
  "*.js",
  "*.json",
  "communication/*.js",
  "projection/*.js",
  "render/*.js",
  "state/*.js",
  "transport/*.js",
  "ui/*.js",
  "schemas/*.json",
]
