[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiont-lab"
version = "0.12.0"
description = "Safe distributed-intelligence simulator with persistent study memory and research lineage"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
symbiont-sim = "symbiont.cli:main"
symbiont-dashboard = "symbiont.dashboard:main"
symbiont-study = "symbiont.study_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
