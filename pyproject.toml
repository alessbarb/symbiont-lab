[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiont-lab"
version = "0.16.0"
description = "Safe distributed-intelligence simulator with equal-attention observer studies"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
symbiont-sim = "symbiont.cli:main"
symbiont-dashboard = "symbiont.dashboard:main"
symbiont-study = "symbiont.study_cli:main"
symbiont-campaign = "symbiont.campaign_cli:main"
symbiont-generations = "symbiont.generations_cli:main"
symbiont-budget = "symbiont.budget_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
