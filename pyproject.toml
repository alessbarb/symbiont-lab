[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiont-lab"
version = "0.24.2"
description = "Safe distributed-intelligence simulator with exact online causal quantiles"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
symbiont-sim = "symbiont.cli:main"
symbiont-dashboard = "symbiont.dashboard:main"
symbiont-study = "symbiont.study_cli:main"
symbiont-campaign = "symbiont.campaign_cli:main"
symbiont-generations = "symbiont.generations_cli:main"
symbiont-budget = "symbiont.budget_cli:main"
symbiont-causal-budget = "symbiont.causal_budget_cli:main"
symbiont-causal-budget-study = "symbiont.causal_budget_study_cli:main"
symbiont-evidence = "symbiont.evidence_cli:main"
symbiont-evidence-study = "symbiont.evidence_study_cli:main"
symbiont-evidence-noise-sweep = "symbiont.evidence_noise_sweep_cli:main"
symbiont-heritage-stress = "symbiont.heritage_stress_cli:main"
symbiont-heritage-stress-study = "symbiont.heritage_stress_study_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
