[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiont-lab"
version = "0.4.0"
description = "Safe simulation of distributed defensive agents with curiosity, trust and bounded reasoning"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
symbiont-sim = "symbiont.cli:main"
symbiont-dashboard = "symbiont.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]
