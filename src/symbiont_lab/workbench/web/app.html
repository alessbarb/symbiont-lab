<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Symbiont Lab — local workbench for embodied Symbiont organisms and controlled studies.">
  <title>Symbiont Lab</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/body.css">
  <link rel="stylesheet" href="/assets/mind.css">
  <link rel="stylesheet" href="/assets/home.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#view-root">Skip to content</a>

  <nav class="rail" aria-label="Main navigation">
    <a class="rail-brand" href="#home" aria-label="Symbiont Lab home">
      <span aria-hidden="true"><span class="brand-s">S</span><span class="brand-l">L</span></span>
    </a>

    <a class="rail-item" href="#home" title="Home — start or continue an embodied run">
      <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20h-5v-5H9v5H4z"/></svg>
      <span class="rail-label">Home</span>
    </a>
    <a class="rail-item" href="#experiments" title="Experiments — controlled studies">
      <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3M8 15h8"/></svg>
      <span class="rail-label">Experiments</span>
    </a>
    <a class="rail-item" href="#body" title="Body — 3D organism viewer">
      <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/></svg>
      <span class="rail-label">Body</span>
    </a>
    <a class="rail-item" href="#mind" title="Mind — cognition and senses">
      <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="rail-label">Mind</span>
    </a>
    <a class="rail-item" href="#archive" title="Archive — run history">
      <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h6"/></svg>
      <span class="rail-label">Archive</span>
    </a>
  </nav>

  <main id="view-root" tabindex="-1"></main>

  <footer class="statusbar">
    <div class="statusbar-state">
      <span id="sb-status" class="sb-item" role="status" aria-live="polite">ready</span>
      <span class="sb-sep" aria-hidden="true">·</span>
      <span id="sb-run" class="sb-item muted">no active run</span>
      <span class="sb-sep" id="sb-sep2" aria-hidden="true" hidden>·</span>
      <span id="sb-detail" class="sb-item muted" hidden></span>
    </div>
    <span class="sb-right">
      <a
        href="https://github.com/alessbarb/symbiont-lab"
        class="statusbar-project muted"
        target="_blank"
        rel="noopener noreferrer"
      >Symbiont Lab</a>
    </span>
  </footer>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
